name: Refresh Investment Dashboard

on:
  push:
    branches:
      - main
  schedule:
    # Every day at 21:00 UTC (05:00 MYT, UTC+8)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard-main
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests feedparser jinja2

      - name: Generate dashboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_dashboard.py

      - name: Configure git user
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "dashboard-bot@users.noreply.github.com"

      - name: Commit changes if any
        id: commit_changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update dashboard — $(date -u +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase -X ours origin/main; then
              if git push origin HEAD:main; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            git rebase --abort || true
            echo "Push attempt ${attempt} failed; retrying after a short delay..." >&2
            sleep 3
          done

          echo "Failed to push dashboard update after 3 attempts." >&2
          exit 1

      - name: Deploy to GitHub Pages
        if: steps.commit_changes.outputs.committed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
